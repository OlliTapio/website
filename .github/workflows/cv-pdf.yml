name: Rebuild CV PDF

on:
  push:
    branches: [main]
    paths: [index.html, css/**, assets/**, scripts/build-cv.mjs]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run cv
      - name: Commit the PDF if it changed
        run: |
          git add otl-cv.pdf
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898283+github-actions[bot]@users.noreply.github.com" \
            commit -m "Rebuild CV PDF"
          git push
